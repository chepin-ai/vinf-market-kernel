name: v∞-finance-daily
on:
  schedule: [{ cron: '30 23 * * 1-5' }]
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: vinf-finance, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q numpy pandas
      - run: python3 ci_finance.py
      - name: commit & push
        run: |
          git config user.email "vinf@kernel.dev"; git config user.name "v-infinity kernel"
          git add -A
          if git diff --cached --quiet; then echo "no-change"; exit 0; fi
          git commit -m "[v∞] finance daily $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            python3 ci_finance.py
            git add -A; git commit -m "[v∞] finance daily $(date -u +%F) (re-run after race)" || true
          done
          git pull --rebase origin main && git push origin HEAD:main
