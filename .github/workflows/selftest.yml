name: engine-selftest
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 2 * * *'   # 每日02:30 UTC 全量自测
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selftest
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy sympy rdflib
      - name: 十项契约自测试
        run: python3 test_engine.py
      - name: 自测试报告入库
        if: always()
        run: |
          git config user.name "vinf-ci"
          git config user.email "ci@vinf.local"
          git add selftest_report.json
          git diff --cached --quiet && exit 0
          git commit -m "[selftest] $(date -u +%F' '%H:%M) report"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            git add selftest_report.json
            git commit -m "[selftest] report (re-run after race)" || true
          done
          exit 1
